management:
  endpoints:
    web:
      discovery:
        enabled: false
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

server:
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
    include-binding-errors: never

logging:
  level:
    root: INFO
    com.nurkiewicz: INFO
